[project]
name = "hyperencoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "colorlog>=6.9.0",
    "huggingface-hub>=0.33.2",
    "hydra-core>=1.3.2",
    "lightning>=2.5.2",
    "numba>=0.59.0",
    "numpy>=1.23.5",
    "omegaconf>=2.3.0",
    "pydantic>=2.11.7",
    "safetensors>=0.5.3",
    "stable-audio-tools>=0.0.19",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "wandb>=0.15.4",
]

[dependency-groups]
dev = [
    "icecream>=2.1.5",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "platform_system != 'Darwin'"},
]
torchvision = [
  { index = "pytorch-cu121", marker = "platform_system != 'Darwin'"},
]
torchaudio = [
  { index = "pytorch-cu121", marker = "platform_system != 'Darwin'"},
]
# stable-audio-tools = { path = "stable-audio-tools" , editable = true }
# pypesq = { git = "https://github.com/vBaiCai/python-pesq" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.isort]
length-sort = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
