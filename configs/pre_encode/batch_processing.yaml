# configs/pre_encode/batch_processing.yaml
# Batch processing configuration for pre-encoding large datasets

# @package _global_
defaults:
  - default

# Override with batch processing optimizations
pre_encode:
  # Required paths (must be specified at runtime)
  input_dir: ???
  output_dir: ???
  
  # Use multiple devices for faster processing
  n_devices: 4
  batch_size: 8  # Larger batch size for throughput
  
  # Batch processing specific settings
  create_output_dir: true
  log_failures: true
  
  # Process files in parallel batches
  use_path_file: true  # Use file list for large datasets
  path_file: "/path/to/batch_file_list.txt"
  
  # Optimized patterns for batch processing
  file_pattern: "*.wav"
  batch_pattern: "Batch\\d*"  # Different pattern for batch folders

# Example usage:
# uv run python -m hyperencoder.pre_encode --config-name=pre_encode \
#   --config-path=configs/pre_encode --config-name=batch_processing \
#   pre_encode.input_dir="/path/to/large/dataset" \
#   pre_encode.output_dir="/path/to/batch/output" 