# configs/training/debug.yaml
# Debug/development training configuration

# @package _global_
defaults:
  - default

# Small batch size for quick testing
batch_size: 16
num_workers: 2

# Frequent checkpointing for debugging
checkpoint_every: 5
val_every: 10

# Single device for debugging
num_nodes: 1
strategy: auto

# Fast precision for debugging
precision: "32"

# Minimal top-k for debugging
save_top_k: 3

# Enable gradient clipping for debugging
gradient_clip_val: 1.0 