# configs/hydra/default.yaml
# Default Hydra runtime configuration

# Hydra behavior settings
defaults:
  - _self_

# Output directory configuration
run:
  dir: outputs/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

sweep:
  dir: multirun/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra:job.num}

# Job configuration
job:
  name: ${oc.env:HYDRA_JOB_NAME,hyperencoder}
  override_dirname: ${hydra:job.override_dirname}
  
# Runtime behavior
runtime:
  cwd: ${hydra:runtime.cwd}

# Launcher configuration for multirun
launcher:
  _target_: hydra._internal.BasicLauncher

# Sweeper configuration
sweeper:
  _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
  max_batch_size: null

# Logging configuration
hydra_logging:
  version: 1
  formatters:
    simple:
      format: '[%(asctime)s][HYDRA] %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
  root:
    level: INFO
    handlers: [console]

job_logging:
  version: 1
  formatters:
    simple:
      format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: simple
      stream: ext://sys.stdout
  root:
    level: INFO
    handlers: [console]
  disable_existing_loggers: false 