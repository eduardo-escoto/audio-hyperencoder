# configs/experiment/hyperencoder_basic.yaml
# Basic hyperencoder experiment configuration


# @package _global_
defaults:
  - override /model: hyperencoder_basic
  - override /data: hyperencoder
  - override /training: default

# Experiment identification
experiment_name: hyperencoder_basic_experiment
run_name: ${training.name}_basic

# Override training for basic model
training:
  name: hyperencoder_basic
  batch_size: 128  # Smaller model, can use smaller batch
  checkpoint_every: 50
  val_every: 100 