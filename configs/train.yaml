# Main Hydra configuration file for hyperencoder
# This file defines the overall structure and defaults for the application

defaults:
  - training: default
  - _self_

# Global application settings
app:
  name: hyperencoder
  version: "0.1.0"

# Override output directory for Hydra
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra:job.num} 