# configs/pre_encode.yaml
# Main configuration for pre-encoding application

defaults:
  - pre_encode: default
  - _self_

# Application settings
app:
  name: hyperencoder-pre-encode
  version: "0.1.0"

# Hydra configuration for pre-encoding
hydra:
  run:
    dir: outputs/pre_encode/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/pre_encode/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra:job.num}
  job:
    name: pre_encode