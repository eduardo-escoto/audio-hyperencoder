# Default training configuration for hyperencoder
# This file defines the default values for training that will be
# loaded into our TrainingConfig Pydantic model

# Run identification
name: hyperencoder_experiment
project: hyperencoder

# Training hyperparameters
batch_size: 32
num_workers: 8
seed: 42
accum_batches: 1

# Hardware configuration
num_nodes: 1
devices: auto
strategy: auto
precision: 16-mixed
persistent_workers: false

# Checkpointing and validation
checkpoint_every: 1
val_every: -1
save_top_k: 20
recover: false

# Optimization
gradient_clip_val: 0.0

# Paths - these will be resolved at runtime
model_config_path: null
dataset_config: null
val_dataset_config: null
save_dir: null

# Resume/checkpoint paths
ckpt_path: null
pretrained_ckpt_path: null
pretransform_ckpt_path: null

# Training metadata
run_id: null
ckpt_name: null

# Logging
logger: wandb

# Legacy options
remove_pretransform_weight_norm: false 