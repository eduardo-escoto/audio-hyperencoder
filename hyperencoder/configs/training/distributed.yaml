# configs/training/distributed.yaml
# Multi-GPU distributed training configuration

# @package _global_
defaults:
  - default

# Override for distributed training
num_nodes: 2
strategy: ddp
precision: "16-mixed"

# Larger batch size for multi-GPU
batch_size: 512
accum_batches: 1

# More workers for multiple GPUs
num_workers: 16

# Faster checkpointing for distributed
checkpoint_every: 50 