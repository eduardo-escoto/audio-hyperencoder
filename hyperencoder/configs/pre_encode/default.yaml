# configs/pre_encode/default.yaml
# Default configuration for pre-encoding audio files to latents

# Model configuration
model_name: "stabilityai/stable-audio-open-1.0"

# Authentication (can be overridden via environment variable or CLI)
hf_token: null

# Input/Output paths (must be specified at runtime)
input_dir: ???  # Required: directory containing audio files
output_dir: ???  # Required: directory to save encoded latents

# File processing configuration
file_pattern: "*.wav"  # Pattern to match audio files
batch_pattern: "Track\\d*"  # Regex pattern to group files into batches

# Hardware configuration
n_devices: 1  # Number of GPU devices to use
batch_size: 1  # Batch size for processing

# Advanced options
create_output_dir: true  # Create output directory if it doesn't exist
log_failures: true  # Log failed files to failures.log
use_path_file: false  # Use file list instead of directory scanning
path_file: null  # Path to file containing list of audio files 