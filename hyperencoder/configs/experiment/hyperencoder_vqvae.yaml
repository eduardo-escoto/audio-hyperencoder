# configs/experiment/hyperencoder_vqvae.yaml
# VQVAE hyperencoder experiment configuration

# @package _global_
defaults:
  - override /model: hyperencoder_vqvae
  - override /data: hyperencoder
  - override /training: default

# Experiment identification
experiment_name: hyperencoder_vqvae_experiment
run_name: ${training.name}_vqvae

# Override training for VQVAE model
training:
  name: hyperencoder_vqvae
  batch_size: 256  # Standard batch size for VQVAE
  checkpoint_every: 25
  val_every: 50
  save_top_k: 5

# VQVAE typically needs different learning dynamics
model:
  training:
    optimizer_configs:
      hyperencoder:
        optimizer:
          lr: 3e-5  # Slightly lower learning rate for VQVAE 