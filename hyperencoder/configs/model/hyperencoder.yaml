# configs/model/hyperencoder.yaml
# Main hyperencoder model configuration

_target_: hyperencoder.models.hyperencoder.HyperEncoder

# Model architecture
encoder:
  _target_: hyperencoder.models.encoders.OobleckEncoder
  in_channels: 64
  channels: 4
  latent_dim: 4
  c_mults: [16, 8, 4, 2, 2]
  strides: [8, 8, 4, 4, 1]
  use_snake: false

decoder:
  _target_: hyperencoder.models.decoders.OobleckDecoder
  out_channels: 64
  channels: 4
  latent_dim: 4
  c_mults: [16, 8, 4, 2, 2]
  strides: [8, 8, 4, 4, 1]
  use_snake: false
  final_tanh: false

bottleneck:
  _target_: hyperencoder.models.bottlenecks.FSQBottleneck
  levels: [8, 5, 5, 5]

# Model dimensions
latent_dim: 4
in_channels: 64
out_channels: 64

# Training configuration
training:
  optimizer_configs:
    hyperencoder:
      optimizer:
        _target_: torch.optim.AdamW
        lr: 5e-5
        betas: [0.9, 0.999]
        weight_decay: 1e-3
      scheduler:
        _target_: stable_audio_tools.training.lr_schedulers.InverseLR
        inv_gamma: 1000000
        power: 0.5
        warmup: 0.99

# Demo settings
demo:
  demo_every: 20
  max_demos: 10 