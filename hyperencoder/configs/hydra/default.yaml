# configs/hydra/default.yaml
# Default Hydra runtime configuration with colorlog

# Hydra behavior settings
defaults:
  - _self_
  - hydra_logging: colorlog
  - job_logging: colorlog

# Output directory configuration
run:
  dir: outputs/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

sweep:
  dir: multirun/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra:job.num}

# Job configuration
job:
  name: ${oc.env:HYDRA_JOB_NAME,hyperencoder}
  override_dirname: ${hydra:job.override_dirname}
  chdir: false  # Don't change working directory
  
# Runtime behavior
runtime:
  cwd: ${hydra:runtime.cwd}

# Launcher configuration for multirun
launcher:
  _target_: hydra._internal.BasicLauncher

# Sweeper configuration
sweeper:
  _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
  max_batch_size: null 